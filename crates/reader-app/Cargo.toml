[package]
name = "reader-app"
version = "1.0.0"
edition.workspace = true
license.workspace = true
default-run = "reader-app"

[dependencies]
archive = { path = "../archive" }
eframe = { version = "0.34.1", default-features = false, features = ["default_fonts", "wgpu"] }
image-pipeline = { path = "../image-pipeline" }
reader-core = { path = "../reader-core" }
reader-ui = { path = "../reader-ui" }

[package.metadata.bundle]
name = "RustComicReader"
identifier = "com.chenfeng.RustComicReader"
icon = ["../../icon.png"]
version = "1.0.0"
short_description = "A fast comic reader for CBZ, ZIP, and image folders."
long_description = """
RustComicReader is a high-performance comic reader supporting CBZ/ZIP archives
and image folders, with background page decoding, caching, thumbnails, and
keyboard navigation.
"""
copyright = "Copyright © 2026 Chenfeng"
category = "public.app-category.graphics-design"
